name: collect-snapshots

on:
  schedule:
    - cron: "*/15 * * * *"   # wake every 15 min; collector.py decides per
                             # event whether a snapshot is due (see CADENCE)
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "psycopg[binary]==3.*"

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector.py

      # GitHub disables cron workflows in repos with no activity for 60 days.
      # A monthly heartbeat commit keeps the schedule alive.
      - name: Monthly keepalive commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            git config user.name "collector-bot"
            git config user.email "actions@github.com"
            date -u > .heartbeat
            git add .heartbeat
            git commit -m "keepalive heartbeat" && git push || true
          fi
